[package]
name = "mouse-voice"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Client for the MouseVoice speech service: one streamed recording per session"

[features]
# `Session::scripted`, for tests of callers that must not reach the network.
testing = []
live = ["dep:hound"]

[dependencies]
aes = "0.8.4"
ecb = { version = "0.1.2", features = ["alloc"] }
crypto-bigint = { version = "0.6.1", default-features = false, features = ["zeroize"] }
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.4"
hex = "0.4"
md-5 = "0.10"
sha2 = "0.10"
snap = "1.1"
serde_json = "1"
url = "2.5"
opus = "0.4"
crossbeam-queue = "0.3"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-websockets = { version = "0.13.3", features = ["client", "ring", "getrandom", "rustls-bring-your-own-connector"] }
# Independent server implementation for offline tests (-p on an excluded crate
# cannot resolve dev-dependencies). The runtime never calls this library.
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
hickory-resolver = "0.26.3"
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# Excluded workspace packages cannot have dev-dependencies when tested with -p.
hound = { version = "3.5", optional = true }

[[example]]
name = "live"
required-features = ["live"]

# This crate is excluded from Hex's workspace and can also run its live example
# independently, including from a worktree nested below the main checkout.
[workspace]
